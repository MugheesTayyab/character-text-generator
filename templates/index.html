<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MatteMind | Character-Level Transformer</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Outfit:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0c0a09;
            --bg-panel: rgba(28, 25, 23, 0.75);
            --border-color: rgba(245, 158, 11, 0.09);
            --border-focus: rgba(249, 115, 22, 0.5);
            --text-main: #fdfaf7;
            --text-muted: #a8a29e;
            --accent-gradient: linear-gradient(135deg, #f59e0b 0%, #ea580c 50%, #db2777 100%);
            --accent: #ea580c;
            --accent-glow: rgba(234, 88, 12, 0.15);
            --radius-lg: 20px;
            --radius-md: 12px;
            --radius-sm: 6px;
        }

        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Ambient Background Blobs */
        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(100px);
            z-index: 0;
            pointer-events: none;
            transition: transform 0.3s cubic-bezier(0.1, 0.8, 0.2, 1);
        }

        .blob-1 { 
            width: 500px; 
            height: 500px; 
            background: radial-gradient(circle, rgba(245, 158, 11, 0.15), transparent); 
            top: -150px; 
            left: -150px; 
            animation: float-slow 20s infinite alternate;
        }

        .blob-2 { 
            width: 600px; 
            height: 600px; 
            background: radial-gradient(circle, rgba(219, 39, 119, 0.12), transparent); 
            bottom: -250px; 
            right: -150px; 
            animation: float-slow 25s infinite alternate-reverse;
        }

        @keyframes float-slow {
            0% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(40px, -60px) scale(1.1); }
            100% { transform: translate(-20px, 30px) scale(0.95); }
        }

        .layout-wrapper {
            display: grid;
            grid-template-columns: 1.8fr 1.2fr;
            gap: 2.5rem;
            width: 100%;
            max-width: 1350px;
            z-index: 1;
        }

        /* Glassmorphism Panel Container */
        .panel {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 3rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            gap: 2.5rem;
            position: relative;
            overflow: hidden;
        }

        .panel::before {
            content: ''; 
            position: absolute; 
            top: 0; 
            left: 0; 
            right: 0; 
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.08), transparent);
        }

        .sidebar {
            background: var(--bg-panel);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 2rem;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 4rem);
            max-height: 850px;
            position: sticky;
            top: 2rem;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
        }

        /* Typography & Headings */
        header {
            border-bottom: 1px solid rgba(255,255,255,0.04);
            padding-bottom: 1.5rem;
        }

        h1 { 
            font-family: 'Outfit', sans-serif;
            font-size: 3rem; 
            font-weight: 700; 
            letter-spacing: -1.5px; 
            margin-bottom: 0.5rem; 
            background: var(--accent-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            display: inline-flex;
            align-items: center;
            gap: 0.75rem;
        }

        p.subtitle { 
            color: var(--text-muted); 
            font-weight: 300; 
            font-size: 1.05rem;
            letter-spacing: -0.2px;
        }

        .badge { 
            font-family: 'Inter', sans-serif;
            background: rgba(245, 158, 11, 0.12); 
            color: #f59e0b; 
            padding: 4px 12px; 
            border-radius: 100px; 
            font-size: 0.75rem; 
            font-weight: 500;
            border: 1px solid rgba(245, 158, 11, 0.25); 
            -webkit-text-fill-color: #f59e0b; /* Override text fill gradient */
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        /* Controls layout */
        .controls-grid { 
            display: grid; 
            grid-template-columns: 1fr 1fr; 
            gap: 2rem; 
        }

        .input-group { 
            display: flex; 
            flex-direction: column; 
            gap: 0.85rem; 
        }

        .input-group.full-width { 
            grid-column: 1 / -1; 
        }

        label { 
            font-size: 0.8rem; 
            color: var(--text-muted); 
            text-transform: uppercase; 
            letter-spacing: 1.5px; 
            font-weight: 500;
            display: flex; 
            justify-content: space-between; 
        }

        .val-display { 
            color: var(--text-main); 
            font-weight: 600; 
            background: rgba(255,255,255,0.05);
            padding: 2px 8px;
            border-radius: 4px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
        }

        /* Glass Textarea */
        textarea {
            background: rgba(0, 0, 0, 0.25);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            color: var(--text-main);
            padding: 1.5rem;
            font-size: 1.05rem;
            line-height: 1.6;
            resize: vertical;
            min-height: 130px;
            font-family: 'Inter', sans-serif;
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        textarea:focus { 
            outline: none; 
            border-color: var(--border-focus); 
            box-shadow: 0 0 0 4px var(--accent-glow), inset 0 2px 8px rgba(0,0,0,0.2); 
            background: rgba(0, 0, 0, 0.35);
        }

        /* Range Sliders */
        input[type="range"] { 
            -webkit-appearance: none; 
            height: 4px; 
            background: rgba(255,255,255,0.07); 
            border-radius: 2px; 
            outline: none; 
            margin: 0.75rem 0; 
            cursor: pointer;
        }

        input[type="range"]::-webkit-slider-thumb { 
            -webkit-appearance: none; 
            width: 18px; 
            height: 18px; 
            border-radius: 50%; 
            background: #fff; 
            box-shadow: 0 0 10px rgba(249, 115, 22, 0.8);
            border: 2px solid var(--accent);
            cursor: pointer; 
            transition: transform 0.2s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }

        input[type="range"]::-webkit-slider-thumb:hover { 
            transform: scale(1.35); 
        }

        /* Buttons & Actions */
        button#generateBtn {
            background: var(--accent-gradient); 
            color: #fff;
            border: none; 
            border-radius: var(--radius-md);
            padding: 1.2rem 2rem; 
            font-size: 1.1rem; 
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.5px;
            cursor: pointer; 
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            width: 100%;
            box-shadow: 0 8px 25px rgba(234, 88, 12, 0.3);
            position: relative; 
            overflow: hidden;
        }

        button#generateBtn:hover { 
            transform: translateY(-2px); 
            box-shadow: 0 12px 30px rgba(234, 88, 12, 0.45); 
        }

        button#generateBtn:active { 
            transform: translateY(0); 
        }

        button#generateBtn:disabled { 
            opacity: 0.6; 
            pointer-events: none; 
            box-shadow: none;
        }

        /* Output View Window */
        .output-container {
            margin-top: 1rem;
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .output-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 0.75rem; 
        }

        .copy-btn { 
            background: rgba(255, 255, 255, 0.04); 
            color: var(--text-muted); 
            border: 1px solid var(--border-color); 
            padding: 0.4rem 1rem; 
            font-size: 0.75rem; 
            border-radius: var(--radius-sm); 
            width: auto; 
            cursor: pointer;
            transition: all 0.2s;
        }

        .copy-btn:hover { 
            background: rgba(255, 255, 255, 0.1); 
            color: var(--text-main); 
            border-color: rgba(255, 255, 255, 0.2);
        }

        .output-box {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 1.75rem;
            font-family: 'Inter', sans-serif;
            font-size: 1.15rem;
            line-height: 1.8;
            min-height: 160px;
            white-space: pre-wrap;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.4);
        }

        .output-box.active { 
            border-color: var(--border-focus); 
            box-shadow: 0 0 25px rgba(234, 88, 12, 0.08), inset 0 2px 10px rgba(0,0,0,0.4); 
        }

        .cursor { 
            display: inline-block; 
            width: 8px; 
            height: 1.25em; 
            background: var(--accent); 
            vertical-align: middle; 
            animation: blink 1s step-end infinite; 
            margin-left: 6px; 
            box-shadow: 0 0 10px var(--accent); 
            border-radius: 2px;
        }

        @keyframes blink { 
            0%, 100% { opacity: 1; } 
            50% { opacity: 0; } 
        }

        /* Pulse Loading Text */
        .loader { 
            display: none; 
            text-align: center; 
            font-size: 0.8rem; 
            color: #ea580c; 
            margin-top: 1.25rem; 
            text-transform: uppercase; 
            letter-spacing: 3px; 
            font-weight: 600;
            animation: pulse 1.5s infinite; 
        }

        .loader.active { 
            display: block; 
        }

        @keyframes pulse { 
            0%, 100% { opacity: 0.4; } 
            50% { opacity: 1; } 
        }

        /* Sidebar & Attention Tracing telemetry */
        .sidebar-header { 
            font-size: 0.75rem; 
            text-transform: uppercase; 
            letter-spacing: 2px; 
            color: var(--text-muted); 
            margin-bottom: 1.5rem; 
            padding-bottom: 0.75rem; 
            border-bottom: 1px solid rgba(255,255,255,0.05); 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            font-weight: 600;
        }

        .live-dot { 
            height: 8px; 
            width: 8px; 
            background-color: #ea580c; 
            border-radius: 50%; 
            display: inline-block; 
            margin-right: 8px; 
            box-shadow: 0 0 10px #ea580c; 
            animation: blink 2.5s infinite; 
        }
        
        .trace-list { 
            flex-grow: 1; 
            overflow-y: auto; 
            display: flex; 
            flex-direction: column; 
            gap: 1rem; 
            padding-right: 0.5rem; 
            font-family: 'JetBrains Mono', monospace; 
        }

        .trace-list::-webkit-scrollbar { 
            width: 4px; 
        }

        .trace-list::-webkit-scrollbar-thumb { 
            background: rgba(255,255,255,0.08); 
            border-radius: 4px; 
        }

        .trace-item {
            font-size: 0.75rem; 
            padding: 1.2rem; 
            background: rgba(0, 0, 0, 0.2);
            border: 1px solid rgba(255, 255, 255, 0.03); 
            border-radius: var(--radius-md);
            transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1); 
            opacity: 0; 
            transform: translateY(10px); 
            animation: slideIn 0.3s forwards;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
        }

        .trace-item.highlight { 
            border-color: rgba(234, 88, 12, 0.35); 
            background: rgba(234, 88, 12, 0.04); 
            box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
        }
        
        .trace-top { 
            display: flex; 
            justify-content: space-between; 
            margin-bottom: 10px; 
            padding-bottom: 8px; 
            border-bottom: 1px solid rgba(255,255,255,0.04); 
        }

        .trace-item .step-num { 
            color: #5b5b66; 
            font-size: 0.7rem;
        }

        .trace-item .chosen { 
            color: #fff; 
            font-weight: 700; 
            font-size: 1.15em; 
            background: rgba(234, 88, 12, 0.2);
            padding: 1px 6px;
            border-radius: 4px;
            border: 1px solid rgba(234, 88, 12, 0.3);
        }

        /* Top 3 Predictions Bars */
        .prob-bar-container { 
            display: flex; 
            flex-direction: column; 
            gap: 6px; 
            margin-top: 10px; 
        }

        .prob-row { 
            display: flex; 
            align-items: center; 
            gap: 10px; 
            font-size: 0.7rem; 
        }

        .prob-char { 
            width: 18px; 
            color: var(--text-muted); 
            text-align: center; 
            background: rgba(255,255,255,0.03);
            border-radius: 3px;
            font-weight: 500;
        }

        .prob-track { 
            flex-grow: 1; 
            height: 5px; 
            background: rgba(255,255,255,0.06); 
            border-radius: 3px; 
            overflow: hidden; 
        }

        .prob-fill { 
            height: 100%; 
            background: rgba(255,255,255,0.25); 
            border-radius: 3px;
            transition: width 0.4s cubic-bezier(0.2, 0.8, 0.2, 1); 
        }

        .prob-row.winner .prob-char { 
            color: #ea580c; 
            background: rgba(234, 88, 12, 0.15);
            font-weight: 700; 
        }

        .prob-row.winner .prob-fill { 
            background: linear-gradient(90deg, #ea580c, #f59e0b); 
            box-shadow: 0 0 6px rgba(234, 88, 12, 0.6); 
        }

        @keyframes slideIn { 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* Branding Footer info */
        .telemetry-footer {
            font-size: 0.65rem;
            color: #52525b;
            text-align: center;
            margin-top: 1.5rem;
            padding-top: 1rem;
            border-top: 1px solid rgba(255,255,255,0.04);
            letter-spacing: 0.5px;
            text-transform: uppercase;
        }

        @media (max-width: 950px) { 
            .layout-wrapper { grid-template-columns: 1fr; } 
            .sidebar { height: 500px; position: relative; top: 0; } 
        }

        @media (max-width: 600px) { 
            .controls-grid { grid-template-columns: 1fr; } 
            .panel { padding: 2rem 1.5rem; } 
            h1 { font-size: 2.2rem; }
        }
    </style>
</head>
<body>

    <div class="blob blob-1" id="blob1"></div>
    <div class="blob blob-2" id="blob2"></div>

    <div class="layout-wrapper">
        <div class="panel">
            <header>
                <h1>MatteMind <span class="badge">Self-Attention</span></h1>
                <p class="subtitle">Transformer Language Architecture Built in Pure NumPy</p>
            </header>

            <div class="controls-grid">
                <div class="input-group full-width">
                    <label for="seedText">Context Window (Seed)</label>
                    <textarea id="seedText" placeholder="To be or not to be, that is the..."></textarea>
                </div>
                <div class="input-group">
                    <label for="temperature">Temperature <span id="tempVal" class="val-display">0.8</span></label>
                    <input type="range" id="temperature" min="0.1" max="1.5" step="0.1" value="0.8">
                </div>
                <div class="input-group">
                    <label for="length">Tokens to Generate <span id="lenVal" class="val-display">200</span></label>
                    <input type="range" id="length" min="50" max="600" step="50" value="200">
                </div>
                <div class="input-group full-width">
                    <button id="generateBtn">Run Forward Pass</button>
                    <div class="loader" id="loader">Computing Matrices...</div>
                </div>
            </div>

            <div class="output-container" id="outputContainer" style="display: none;">
                <div class="output-header">
                    <label>Output Sequence</label>
                    <button class="copy-btn" id="copyBtn">Copy</button>
                </div>
                <div class="output-box" id="outputBox"></div>
            </div>
        </div>

        <div class="sidebar">
            <div class="sidebar-header">
                <span>Model Telemetry</span>
                <span id="traceStatus">
                    <span class="live-dot" style="display:none;" id="liveDot"></span>
                    <span id="statusText">Awaiting Input</span>
                </span>
            </div>
            
            <div class="trace-list" id="traceList">
                <div style="color: #4b4b5c; text-align: center; margin-top: 2rem; font-family: 'Inter', sans-serif; font-size: 0.85rem; padding: 0 1rem; line-height: 1.5;">
                    Attention matrix dot-products and soft probabilities will stream here in real time.
                </div>
            </div>

            <div class="telemetry-footer">
                NumPy Core AI Engine: Active
            </div>
        </div>
    </div>

    <script>
        // Lively Interactive Background
        document.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            document.getElementById('blob1').style.transform = `translate(${x * 35}px, ${y * 35}px)`;
            document.getElementById('blob2').style.transform = `translate(${x * -45}px, ${y * -45}px)`;
        });

        // UI Slider Logic
        const tempSlider = document.getElementById('temperature');
        const tempVal = document.getElementById('tempVal');
        tempSlider.addEventListener('input', (e) => tempVal.textContent = parseFloat(e.target.value).toFixed(1));

        const lenSlider = document.getElementById('length');
        const lenVal = document.getElementById('lenVal');
        lenSlider.addEventListener('input', (e) => lenVal.textContent = e.target.value);

        const generateBtn = document.getElementById('generateBtn');
        const copyBtn = document.getElementById('copyBtn');
        const seedText = document.getElementById('seedText');
        const outputContainer = document.getElementById('outputContainer');
        const outputBox = document.getElementById('outputBox');
        const loader = document.getElementById('loader');
        const traceList = document.getElementById('traceList');
        const statusText = document.getElementById('statusText');
        const liveDot = document.getElementById('liveDot');

        let fullOutputText = "";

        copyBtn.addEventListener('click', () => {
            navigator.clipboard.writeText(fullOutputText);
            copyBtn.textContent = "Copied!";
            setTimeout(() => copyBtn.textContent = "Copy", 2000);
        });

        async function typeWriterWithTrace(text, traceData, element, traceContainer) {
            element.innerHTML = ''; 
            traceContainer.innerHTML = '';
            outputBox.classList.add('active');
            statusText.textContent = 'Streaming';
            statusText.style.color = '#ea580c';
            liveDot.style.display = 'inline-block';
            
            const textNode = document.createTextNode('');
            element.appendChild(textNode);
            const cursor = document.createElement('span'); 
            cursor.className = 'cursor';
            element.appendChild(cursor);
            
            const seedNode = document.createElement('div'); 
            seedNode.className = 'trace-item';
            seedNode.innerHTML = `<span style="color: #5b5b66">Initialization:</span> Processed ${seedText.value.trim().length} tokens.`;
            traceContainer.appendChild(seedNode);

            const seedLen = seedText.value.trim().length;
            textNode.nodeValue = text.substring(0, seedLen);

            let lastHighlight = null;

            for (let i = 0; i < traceData.length; i++) {
                const stepData = traceData[i];
                textNode.nodeValue += stepData.chosen_char;
                
                const traceEl = document.createElement('div');
                traceEl.className = 'trace-item highlight';
                
                let ctxStr = stepData.context_str;
                let attWeights = stepData.attention || [];
                let startIdx = Math.max(0, ctxStr.length - 20);
                let visibleCtx = "";
                
                for (let j = startIdx; j < ctxStr.length; j++) {
                    let char = ctxStr[j].replace(/ /g, '·').replace(/\n/g, '↵');
                    let weight = attWeights[j] || 0;
                    let opacity = Math.min(1.0, 0.4 + (weight * 2.5)); 
                    let color = weight > 0.1 ? '#f59e0b' : 'inherit';
                    visibleCtx += `<span style="opacity: ${opacity}; color: ${color};">${char}</span>`;
                }
                
                let visibleChar = stepData.chosen_char.replace(/ /g, '·').replace(/\n/g, '↵');
                
                // Build Top 3 probabilities UI
                let probsHtml = `<div class="prob-bar-container">`;
                if(stepData.top_3) {
                    stepData.top_3.forEach(p => {
                        let isWinner = p.char === stepData.chosen_char;
                        let displayChar = p.char.replace(/ /g, '·').replace(/\n/g, '↵');
                        let pct = Math.min(100, Math.max(2, p.prob * 100)); // min 2% for visibility
                        probsHtml += `
                        <div class="prob-row ${isWinner ? 'winner' : ''}">
                            <div class="prob-char">${displayChar}</div>
                            <div class="prob-track"><div class="prob-fill" style="width: ${pct}%"></div></div>
                            <div style="width: 32px; text-align: right; color: #71717a;">${Math.round(p.prob*100)}%</div>
                        </div>`;
                    });
                }
                probsHtml += `</div>`;

                traceEl.innerHTML = `
                    <div class="trace-top">
                        <span class="step-num">[${stepData.step.toString().padStart(3, '0')}] Attention Window</span>
                        <span class="chosen">${visibleChar}</span>
                    </div>
                    <div style="font-size: 1.15em; letter-spacing: 0.5px; margin-bottom: 12px; text-align: center; background: rgba(0,0,0,0.4); padding: 6px; border-radius: 6px; border: 1px solid rgba(255,255,255,0.02);">${visibleCtx}</div>
                    <div style="color: #52525b; font-size: 0.65rem; text-transform: uppercase; font-weight: 600; letter-spacing: 1px;">Top Predictions</div>
                    ${probsHtml}
                `;
                
                traceContainer.appendChild(traceEl);
                if (lastHighlight) lastHighlight.classList.remove('highlight');
                lastHighlight = traceEl;
                
                traceContainer.scrollTop = traceContainer.scrollHeight;
                element.scrollTop = element.scrollHeight;

                await new Promise(r => setTimeout(r, 15)); // Smooth typewriter flow
            }
            
            if (lastHighlight) lastHighlight.classList.remove('highlight');
            outputBox.classList.remove('active');
            statusText.textContent = 'Completed';
            statusText.style.color = '#71717a';
            liveDot.style.display = 'none';
        }

        generateBtn.addEventListener('click', async () => {
            const seed = seedText.value.trim();
            if (!seed) return;

            generateBtn.disabled = true;
            generateBtn.textContent = 'Synthesizing...';
            loader.classList.add('active');
            outputContainer.style.display = 'none';
            traceList.innerHTML = '<div style="color: #52525b; text-align: center; margin-top: 2rem;">Computing Attention Matrices...</div>';
            statusText.textContent = 'Computing';

            try {
                const response = await fetch('/api/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        seed: seed,
                        temperature: parseFloat(tempSlider.value),
                        length: parseInt(lenSlider.value)
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    fullOutputText = data.result;
                    outputContainer.style.display = 'block';
                    await typeWriterWithTrace(data.result, data.trace, outputBox, traceList);
                } else {
                    alert('Error: ' + data.error);
                }
            } catch (err) {
                alert('Network Error: ' + err.message);
            } finally {
                generateBtn.disabled = false;
                generateBtn.textContent = 'Run Forward Pass';
                loader.classList.remove('active');
            }
        });
    </script>
</body>
</html>
